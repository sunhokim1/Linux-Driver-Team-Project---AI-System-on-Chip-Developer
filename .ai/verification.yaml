# 프로젝트에서 실제 사용하는 명령만 설정한다. null은 미설정이며 통과가 아니다.
# 변경과 관련된 사용 가능한 명령만 실행하고 결과와 미실행 사유를 보고한다.
# 선택한 단일 모델이 구현 후 관련 검증을 직접 수행한다.
# 이미 실행된 검증은 최종 코드가 그대로면 반복하지 않는다.
commands:
  test: "make test"
  lint: null
  typecheck: null
  build: "make user"
  acceptance: null

# 근거: 루트 Makefile 및 README.md. Linux / Jetson 환경에서 실행한다.
# test는 State/Event/Output/LED 모의 테스트와 Main 통합 시나리오를 실행한다.
# 실제 GPIO/센서/PWM 동작 검증은 별도이며 모의 테스트 통과로 대체하지 않는다.
# 커널 변경 시 추가 명령: make kernel KDIR=/path/to/target/kernel/build
# 타깃 JetPack/Kernel 버전과 헤더가 확정된 환경에서 별도로 실행한다.
# lint/typecheck/acceptance는 프로젝트 명령이 정의되지 않아 미설정이다.
